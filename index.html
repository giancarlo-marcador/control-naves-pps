<title>Página privada</title>
<style>
:root{--azul:#1e4e8c;--azul2:#e8eef7;--gris:#5b6472;--borde:#d7dde6;--fondo:#f5f7fa}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:var(--fondo);color:#1f2933}
.box{width:min(420px,calc(100% - 32px));background:#fff;border:1px solid var(--borde);border-radius:14px;padding:28px 24px;box-shadow:0 8px 28px rgba(15,30,55,.08)}
.tag{display:inline-block;background:var(--azul);color:#fff;font-size:11px;letter-spacing:.08em;text-transform:uppercase;padding:3px 9px;border-radius:99px;margin:0 0 12px}
h1{margin:0 0 8px;font-size:22px;color:var(--azul);line-height:1.25}
p{margin:0 0 16px;color:var(--gris);font-size:15px;line-height:1.5}
label{display:block;font-size:13px;font-weight:650;margin:0 0 6px;color:#1f2933}
input[type=password],input[type=text]{width:100%;border:1px solid var(--borde);border-radius:10px;padding:11px 12px;font-size:16px;letter-spacing:.08em}
input:focus{outline:2px solid rgba(30,78,140,.35);border-color:var(--azul)}
button{margin-top:12px;width:100%;border:0;border-radius:10px;background:var(--azul);color:#fff;font-weight:700;font-size:15px;padding:11px 14px;cursor:pointer}
button:hover{background:#163a6b}
button:disabled{opacity:.65;cursor:wait}
.pw{position:relative}.pw input{padding-right:48px}.ojo{position:absolute;right:6px;top:50%;transform:translateY(-50%);margin:0;width:auto;background:transparent;color:#1f2933;font-size:20px;padding:4px 8px}.ojo:hover{background:#eef2f7}.ojo.on{opacity:.5}
.err{display:none;margin:10px 0 0;color:#c1121f;font-size:14px}
.err.on{display:block}
</style>
</head>

<form class="box" id="gate" autocomplete="off">
  <div class="tag">Uso interno</div>
  <h1>Página privada</h1>
  <p>Esta página es solo para Giancarlo. Ingresa la clave para ver el control de naves.</p>
  <label for="clave">Clave</label>
  <div class="pw"><input id="clave" name="clave" type="password" required autofocus spellcheck="false" autocapitalize="off" autocomplete="new-password"><button type="button" id="ojo" class="ojo" aria-label="Mostrar clave" title="Mostrar clave">&#128065;</button></div>
  <button type="submit" id="go">Entrar</button>
  <div class="err" id="err">Clave incorrecta. Inténtalo de nuevo.</div>
</form>

(function(){
  var SS = 'control-naves-pps:clave';
  function b64(s){
    var bin = atob(s);
    var u = new Uint8Array(bin.length);
    for (var i=0;i<bin.length;i++) u[i] = bin.charCodeAt(i);
    return u;
  }
  async function deriveKey(password, salt, iter){
    var enc = new TextEncoder();
    var material = await crypto.subtle.importKey('raw', enc.encode(password), 'PBKDF2', false, ['deriveKey']);
    return crypto.subtle.deriveKey(
      {name:'PBKDF2', salt:salt, iterations:iter, hash:'SHA-256'},
      material,
      {name:'AES-GCM', length:256},
      false,
      ['decrypt']
    );
  }
  async function unlock(password){
    var salt = b64(PAYLOAD.salt);
    var iv = b64(PAYLOAD.iv);
    var data = b64(PAYLOAD.data);
    var key = await deriveKey(password, salt, PAYLOAD.iter);
    var plain = await crypto.subtle.decrypt({name:'AES-GCM', iv:iv}, key, data);
    var html = new TextDecoder().decode(plain);
    document.open();
    document.write(html);
    document.close();
  }
  var form = document.getElementById('gate');
  var err = document.getElementById('err');
  var go = document.getElementById('go');
  var input = document.getElementById('clave');
  var ojo = document.getElementById('ojo');
  ojo.addEventListener('click', function(){ var v = input.type === 'password'; input.type = v ? 'text' : 'password'; ojo.classList.toggle('on', v); ojo.setAttribute('aria-label', v ? 'Ocultar clave' : 'Mostrar clave'); input.focus(); });
  form.addEventListener('submit', function(e){
    e.preventDefault();
    err.classList.remove('on');
    var pw = input.value.trim();
    go.disabled = true;
    unlock(pw).then(function(){
      try { sessionStorage.setItem(SS, pw); } catch (x) {}
    }).catch(function(){
      go.disabled = false;
      err.classList.add('on');
      input.select();
    });
  });
  try {
    var saved = sessionStorage.getItem(SS);
    if (saved) {
      go.disabled = true;
      unlock(saved).catch(function(){
        try { sessionStorage.removeItem(SS); } catch (x) {}
        go.disabled = false;
      });
    }
  } catch (x) {}
})();
</script>
